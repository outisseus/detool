[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "detool"
version = "0.2.0"
description = "Transport-neutral contracts for verifiable external capability execution."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
detool = "detool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

